[package]
name = "sonar-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Sonar core: scan, analysis, index and search for local sample libraries."

[features]
default = []
# CLAP embeddings through ONNX Runtime (T5.2, ADR-027): the session pool and
# the text tower. The front end, the embedding store and the `Embed` stage
# plumbing are always built; without this feature the stage is unavailable
# (skipped). `sonar-cli` enables it; `sonar-ffi` does not (ONNX Runtime is a
# static library the app link step would have to know about; T5.6).
embed = ["dep:ort", "dep:tokenizers"]
# Exposes the DEV license signing key (`license::dev`) to other crates' tests.
# Never enabled in a shipped build (T7.5, ADR-038).
dev-keys = []

[dependencies]
memmap2.workspace = true
ort = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
notify.workspace = true
rayon.workspace = true
realfft.workspace = true
rubato.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
symphonia.workspace = true
tantivy.workspace = true
thiserror.workspace = true
tracing.workspace = true
twox-hash.workspace = true
unicode-normalization.workspace = true
# License keys (T7.5, ADR-038). ed25519-dalek is BSD-3-Clause, base64 and
# getrandom are MIT OR Apache-2.0. No `rand_core` feature: key generation
# draws its 32 seed bytes from the OS through `getrandom`.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
base64 = "0.23"
getrandom = "0.3"

[dev-dependencies]
hound.workspace = true
tempfile.workspace = true
