[package]
name = "uniffi-bindgen"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "UniFFI bindings generator CLI (build tool for scripts/build-core.sh; not shipped)."

# Separate crate so the heavy `cli` feature (clap, bindgen, cargo_metadata)
# never enters the sonar-ffi library build.
[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli", "cargo-metadata"] }
