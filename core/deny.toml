# cargo-deny configuration (schema version 2, cargo-deny >= 0.14; tested 0.20).
# Enforces ADR-004: permissive licenses only, crates.io only.
# Run: `cargo deny check licenses bans sources` (part of scripts/check.sh).

[graph]
all-features = true

[licenses]
version = 2
# Permissive licenses only. Do NOT add GPL, AGPL or LGPL (ADR-004).
# Keep this list as small as the dependency tree allows; unused entries
# only trigger a warning (see `unused-allowed-license`).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0", # Unicode data tables (unicode-ident); see ADR-004
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
# Our own crates are `publish = false` with `LicenseRef-Proprietary`.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies have no version requirement; do not flag them.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
