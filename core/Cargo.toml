[workspace]
resolver = "2"
members = [
    "crates/sonar-core",
    "crates/sonar-cli",
    "crates/sonar-ffi",
    "crates/uniffi-bindgen",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false

# Shared third-party versions. Crates opt in with `x.workspace = true`.
# Licenses must satisfy ADR-004 (enforced by `cargo deny`, see deny.toml).
[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "ansi", "std"] }
# MPL-2.0. Library side uses no default features (no cargo_metadata); only the
# `uniffi-bindgen` helper crate enables `cli` + `cargo-metadata`.
uniffi = { version = "0.32.2", default-features = false }
# MIT. `bundled` compiles SQLite (public domain) in: no system lib, known version.
rusqlite = { version = "0.41.1", features = ["bundled"] }
# MIT OR Apache-2.0. Work-stealing pool for CPU/IO-parallel stages (scan hashing).
rayon = "1.12.0"
# MIT. XXH3-64 for `files.quick_hash` (scan identity). Not `xxhash-rust`
# (BSL-1.0, not on the ADR-004 allow list). No `random` (pulls `rand`).
twox-hash = { version = "2.1.5", default-features = false, features = ["std", "xxhash3_64"] }
# MPL-2.0. Pure-Rust demux/decode. Only the containers/codecs behind the
# scanner's extension list (wav aif aiff flac mp3 ogg m4a) plus ADPCM WAVs
# and ID3v2 tag skipping; no mkv/caf, no mp1/mp2.
symphonia = { version = "0.6.1", default-features = false, features = [
    "opt-simd", "wav", "aiff", "pcm", "adpcm", "flac", "mp3", "ogg", "vorbis",
    "isomp4", "aac", "alac", "id3v2",
] }
# MIT OR Apache-2.0. Band-limited resampling to the analysis rate (FFT
# resampler: synchronous, fixed ratio, fast).
rubato = "5.0.1"
# CC0-1.0 (public-domain dedication). FSEvents file watching (ADR-014). No
# `crossbeam-channel` feature: events go through std mpsc.
notify = { version = "8.2.2", default-features = false, features = ["macos_fsevent"] }
# Test-only (dev-dependencies).
hound = "3.5.1"      # Apache-2.0; independent WAV reader to verify our writer
tempfile = "3.27.0"  # MIT OR Apache-2.0

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2   # keep DSP/tests fast in debug builds
