# XcodeGen spec for the Sonar macOS app (ARCHITECTURE.md §8, ADR-002/003).
# Generate with `cd app && xcodegen generate`; never hand-edit the .xcodeproj.
name: Sonar

options:
  bundleIdPrefix: app.sonar
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Dev/check builds are arm64 only (matches the arm64 core xcframework that
    # scripts/build-core.sh builds by default). scripts/release.sh overrides
    # ARCHS="arm64 x86_64" on the xcodebuild command line together with a
    # universal core (SONAR_CORE_ARCHS=universal).
    ARCHS: arm64
    # Sparkle updates (ADR-037). Empty in dev builds: the updater stays inert.
    # scripts/release.sh passes them from SONAR_SPARKLE_FEED_URL / _PUBLIC_KEY.
    SONAR_SPARKLE_FEED_URL: ""
    SONAR_SPARKLE_PUBLIC_KEY: ""
    # Purchase page (https) for the expired-license gate. Empty hides the Buy
    # button; scripts/release.sh passes $SONAR_PURCHASE_URL through.
    SONAR_PURCHASE_URL: ""
    # Ad-hoc signing: builds without an Apple developer account.
    # Release signing/notarization is configured by the release pipeline.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  # Sparkle 2 (MIT) auto-update framework, pinned exactly (ADR-037).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

targets:
  Sonar:
    type: application
    platform: macOS
    sources:
      - path: Sonar
      # UniFFI Swift bindings, generated by scripts/build-core.sh (gitignored).
      - path: Generated/SonarCore.swift
        group: Generated
    dependencies:
      # Static lib of the Rust core (sonar-ffi) + C module `SonarCoreFFI`.
      # Built by scripts/build-core.sh, never by an Xcode script phase.
      - framework: Generated/SonarCore.xcframework
        embed: false
        link: true
      - package: Sparkle
    info:
      path: Sonar/Info.plist
      properties:
        CFBundleDisplayName: Sonar
        CFBundleName: Sonar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: "Copyright © 2026 Sonar. All rights reserved."
        NSPrincipalClass: NSApplication
        SUFeedURL: $(SONAR_SPARKLE_FEED_URL)
        SUPublicEDKey: $(SONAR_SPARKLE_PUBLIC_KEY)
        SonarPurchaseURL: $(SONAR_PURCHASE_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sonar.Sonar
        PRODUCT_NAME: Sonar
        # Direct distribution (ADR-003): hardened runtime, no App Sandbox.
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES

  SonarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SonarTests
    dependencies:
      - target: Sonar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sonar.SonarTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Sonar.app/Contents/MacOS/Sonar
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Sonar:
    build:
      targets:
        Sonar: all
        SonarTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - SonarTests
    archive:
      config: Release
